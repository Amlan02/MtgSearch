<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MtgSearch</title>
  <!-- Bootstrap CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="css/styles.css"> <!-- Your custom styles -->
</head>

<body>

  <div class="container-fluid">
    <div class="row">
      <div class="col-12">
        <div class="header text-center">
          <h1 id="title">MtgSearch</h1>
        </div>
      </div>
    </div>

    <div class="row">
      <div class="col-md-9">
        <div class="container">
          <div class="row">
            <div class="col-md-12" id="formContainer">
              <form id="searchForm" class="d-flex">
                <input id="input" type="text" name="input" class="form-control" value="test">
                <button id="submit" type="submit" class="btn btn-primary">Search</button>
              </form>
            </div>
          </div>

          <div class="row">
            <div class="col-md-12">
              <div class="wrapper" id="resultsContainer">
                <!-- Card results will be appended here -->
              </div>
            </div>
            <div class="col-md-3">
              <div id="decklist" class="bg-secondary">
                <!-- Decklist content will be appended here -->
              </div>
            </div>
          </div>
        </div>
      </div>

      
    </div>
  </div>

  <!-- Bootstrap JS and Popper.js (required for Bootstrap JS) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script type="text/javascript" src="javascript/main.js"></script>
</body>
</html>
